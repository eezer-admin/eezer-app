name: Build & submit to app stores with EAS

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build for"
        type: choice
        required: true
        default: "android"
        options:
          - "android"
          - "ios"
          - "all"

jobs:
  build:
    name: Install, build and submit app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node environment
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Authenticate with Fender
        run: >-
          npm config set
          "//fender.app/registry/npm/:_authToken=${FENDER_TOKEN}"
        env:
          FENDER_TOKEN: ${{ secrets.FENDER_TOKEN }}

      - name: Install dependencies
        run: npm install --frozen-lockfile

      - name: Generate native modules with `expo prebuild`
        run: npx expo prebuild

      - name: Build and submit on EAS
        run: eas build --platform ${{ github.event.inputs.platform }} --non-interactive --auto-submit --no-wait --clear-cache

      - name: Report deployment to Fender
        run: >-
          curl -sS --fail-with-body "https://fender.app/registry/deployments?environment=production"
          -H "Authorization: Bearer ${FENDER_TOKEN}"
          -H "Content-Type: application/octet-stream"
          --data-binary @package-lock.json
        env:
          FENDER_TOKEN: ${{ secrets.FENDER_TOKEN }}
