name: Typecheck

on:
  pull_request: ~
  push:
    branches:
      - master

jobs:
  typecheck:
    name: Verify TypeScript compiles without errors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node environment
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Authenticate against the Fender npm registry
        run: echo "//fender-tepyfoha.on-forge.com/:_authToken=${{ secrets.FENDER_NPM_TOKEN }}" >> ~/.npmrc

      - name: Install dependencies
        run: npm ci

      - name: Run tsc
        run: npm run typecheck
