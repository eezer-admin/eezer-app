name: Run tests & check coverage

on:
  pull_request: ~

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Authenticate with Fender
        run: >-
          npm config set
          "//fender.app/registry/npm/:_authToken=${FENDER_TOKEN}"
        env:
          FENDER_TOKEN: ${{ secrets.FENDER_TOKEN }}
      - uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          test-script: npm run test-report
          package-manager: npm
