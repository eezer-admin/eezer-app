name: Build & submit to app stores with EAS

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build for"
        type: choice
        required: true
        default: "android"
        options:
          - "android"
          - "ios"
          - "all"

jobs:
  build:
    name: Install, build and submit app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node environment
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Authenticate against the Fender npm registry
        run: echo "//fender-tepyfoha.on-forge.com/:_authToken=${{ secrets.FENDER_NPM_TOKEN }}" >> ~/.npmrc

      - name: Install dependencies
        run: npm install --frozen-lockfile

      - name: Generate native modules with `expo prebuild`
        run: npx expo prebuild

      - name: Build and submit on EAS
        run: eas build --platform ${{ github.event.inputs.platform }} --non-interactive --auto-submit --no-wait --clear-cache
